# First run, to log in with 2FA and store the secrets in the volume:
#   docker compose run --rm -it synology-mcp setup --url https://nas.example.com:5001
# Then:
#   SYNOLOGY_MCP_TOKEN=$(openssl rand -hex 32) docker compose up -d
#
# The port stays on loopback. To reach it from elsewhere, put an HTTPS reverse proxy in front
# (Login Portal > Reverse Proxy) and add its host name to SYNOLOGY_MCP_ALLOWED_HOSTS.
services:
  synology-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SYNOLOGY_MCP_TOKEN: ${SYNOLOGY_MCP_TOKEN:-}
      SYNOLOGY_MCP_ALLOWED_HOSTS: ${SYNOLOGY_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - synology-mcp-data:/data

volumes:
  synology-mcp-data:
