name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # npm test rebuilds dist/ first, so the check below sees what the source really produces.
      - run: npm test
      - name: dist/ matches the source
        run: git diff --exit-code --stat -- dist || (echo "Run npm run compile and commit dist/." && exit 1)
